name: ATLAS - Verificação de código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verificar regressões e compilação
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://ep-old-morning-b62n5wss.neonauth.c-2.sa-east-1.aws.neon.tech/atlas_db/auth
      NEON_AUTH_COOKIE_SECRET: atlas-ci-only-cookie-secret-not-for-production-2026

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar contratos das funcionalidades existentes
        run: npm run test:regression

      - name: Verificar compilação
        run: npm run build
